[project]
name = "xodus"
version = "0.0.1"
description = "XODUS local-first personal AI workspace (Gate B vertical slice)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "nvidia-ml-py>=13.615.71",
    "psutil>=7.2.2",
    "pydantic-settings>=2.16.1",
    "pywin32>=312 ; sys_platform == 'win32'",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xodus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "ollama: needs a running Ollama server with the configured model (skipped otherwise)",
    "gpu: needs an NVIDIA GPU with NVML or Windows GPU performance counters (skipped otherwise)",
    "e2e: drives the built UI in the installed Google Chrome via Playwright (skipped otherwise)",
]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]
